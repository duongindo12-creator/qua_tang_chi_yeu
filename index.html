<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Món Quà Kỷ Niệm</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #0b0b10;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        /* Khung điện thoại mô phỏng */
        .phone-frame {
            position: relative;
            width: 340px;
            height: 680px;
            background: #000;
            border-radius: 40px;
            border: 4px solid #333;
            box-shadow: 0 0 30px rgba(255, 105, 180, 0.3);
            overflow: hidden;
        }
        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }
        /* Giao diện nút bấm trên điện thoại */
        .ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            z-index: 10;
        }
        .top-bar {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            pointer-events: auto;
        }
        .icon-btn {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            backdrop-filter: blur(5px);
        }
        .bottom-title {
            text-align: center;
            background: rgba(0, 0, 0, 0.4);
            padding: 10px;
            border-radius: 15px;
            backdrop-filter: blur(5px);
            font-size: 14px;
            color: #ff94b8;
        }
    </style>
</head>
<body>

    <div class="phone-frame">
        <!-- Vùng chứa hiệu ứng 3D Three.js -->
        <div id="canvas-container"></div>

        <!-- Lớp giao diện phủ lên -->
        <div class="ui-overlay">
            <div class="top-bar">
                <div class="icon-btn" id="soundBtn" title="Bật/Tắt nhạc">🔊</div>
                <div class="icon-btn" title="Trợ giúp">?</div>
            </div>
            <div class="bottom-title">
                Gửi Phương Anh - Kỷ niệm yêu thương ❤️
            </div>
        </div>
    </div>

    <!-- Nhúng thư viện Three.js từ CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Thiết lập không gian 3D với Three.js
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, container.clientWidth / container.clientHeight, 0.1, 1000);
        camera.position.z = 30;

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        // Tạo hiệu ứng hạt trái tim 3D hồng rực rỡ
        const particleCount = 1500;
        const geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(particleCount * 3);

        for (let i = 0; i < particleCount; i++) {
            // Công thức toán học tạo hình trái tim 3D
            const t = Math.random() * Math.PI * 2;
            const u = Math.random() * Math.PI;
            
            let x = 16 * Math.pow(Math.sin(t), 3);
            let y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
            let z = (Math.random() - 0.5) * 5;

            // Thu nhỏ kích thước cho vừa khung hình
            positions[i * 3] = x * 0.6;
            positions[i * 3 + 1] = y * 0.6;
            positions[i * 3 + 2] = z;
        }

        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

        // Màu sắc và kiểu hạt sáng lấp lánh
        const material = new THREE.PointsMaterial({
            color: 0xff3366,
            size: 0.6,
            transparent: true,
            opacity: 0.8,
            blending: THREE.AdditiveBlending
        });

        const particleSystem = new THREE.Points(geometry, material);
        scene.add(particleSystem);

        // Hiệu ứng chuyển động xoay nhẹ nhàng
        function animate() {
            requestAnimationFrame(animate);
            particleSystem.rotation.y += 0.005;
            renderer.render(scene, camera);
        }
        animate();

        // Xử lý co giãn màn hình theo kích thước khung điện thoại
        window.addEventListener('resize', () => {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        });
    </script>
</body>
</html>
